<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOMU — Project Management Skills · PMP® Exam Preparation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* هوية SOMU — مستخرجة من عرض الشرائح */
  --navy:#103040; --navy2:#1a4459; --sky:#70C0E0; --sky2:#4aa8d0;
  --violet:#201080; --green:#40C090; --green2:#2fa87a; --orange:#F07000;
  --ink:#16242e; --mut:#6b8090; --bg:#f2f6f8; --card:#fff; --line:#d8e3ea;
  --bad:#c0392b; --gold:#d9a12c;
  --f:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;
  --fe:'IBM Plex Sans',system-ui,sans-serif;
  --m:'IBM Plex Mono',monospace;
  --fs:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--ink);line-height:1.75;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.m{font-family:var(--m);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate;font-family:var(--fe)}
.iso{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ───── الشعار ───── */
.logo{display:flex;align-items:center;gap:11px}
.lg-mark{font-family:var(--fe);font-weight:700;font-size:1.42rem;letter-spacing:-.5px;
  color:#fff;display:flex;align-items:baseline;gap:1px;line-height:1;
  direction:ltr;unicode-bidi:isolate}
.lg-mark i{font-style:normal;color:var(--sky)}
.lg-mark u{text-decoration:none;width:9px;height:9px;border-radius:50%;
  background:var(--sky);display:inline-block;margin-inline-start:2px;align-self:flex-end;
  margin-bottom:3px}
.lg-t b{display:block;font-size:.79rem;font-weight:600;color:#fff;line-height:1.3}
.lg-t span{font-size:.65rem;color:var(--sky);letter-spacing:.3px}

/* ───── الترويسة ───── */
.top{background:var(--navy);padding:12px 22px;display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;position:sticky;top:0;z-index:60}
.sp{flex:1}
.pill{font-size:.73rem;padding:4px 12px;border-radius:20px;color:#cfe4ef;
  direction:ltr;unicode-bidi:isolate;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16)}
.fsz{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.09);
  border-radius:8px;padding:2px}
.fsz button{width:26px;height:26px;border-radius:6px;font-size:.8rem;color:#cfe4ef;
  display:flex;align-items:center;justify-content:center}
.fsz button:hover{background:rgba(255,255,255,.16)}
.fsz span{font-size:.67rem;padding:0 5px;color:#9fbccd;min-width:34px;text-align:center}

/* ───── التنقّل ───── */
.nav{background:#fff;border-bottom:1px solid var(--line);padding:0 22px;display:flex;
  gap:2px;overflow-x:auto;position:sticky;top:53px;z-index:59}
.nav button{padding:13px 16px;font-size:.87rem;color:var(--mut);white-space:nowrap;
  border-bottom:3px solid transparent;transition:.16s;margin-bottom:-1px}
.nav button:hover{color:var(--navy)}
.nav button[aria-current=true]{color:var(--navy);border-bottom-color:var(--sky);font-weight:600}

.wrap{max-width:1180px;margin:0 auto;padding:24px 22px 60px}
.hero{background:linear-gradient(140deg,var(--navy),var(--navy2));color:#fff;
  border-radius:16px;padding:30px;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset-inline-end:-50px;top:-50px;width:230px;height:230px;
  border-radius:50%;background:radial-gradient(circle,rgba(112,192,224,.22),transparent 70%)}
.hero .k{font-size:.68rem;letter-spacing:2.4px;color:var(--sky);font-weight:600;
  font-family:var(--fe)}
.hero h1{font-size:1.72rem;font-weight:700;margin:5px 0 7px;position:relative}
.hero p{color:#bdd6e3;font-size:.92rem;max-width:640px;position:relative}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px;
  margin-top:19px;position:relative}
.st{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);
  border-radius:11px;padding:13px}
.st b{display:block;font-family:var(--m);font-size:1.5rem;color:var(--sky);font-weight:600}
.st span{font-size:.71rem;color:#9fbccd}
.bars{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:18px}
.bars i{flex:1}
h2.sec{font-size:1.14rem;font-weight:700;margin:24px 0 13px;padding-bottom:8px;
  border-bottom:2px solid var(--line)}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;
  transition:.18s}
.card.link{cursor:pointer}
.card.link:hover{border-color:var(--sky2);transform:translateY(-2px);
  box-shadow:0 8px 20px -11px rgba(16,48,64,.28)}
.card h3{font-size:1rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card p{font-size:.85rem;color:var(--mut);line-height:1.75}
.card .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.tag{font-size:.71rem;padding:3px 10px;border-radius:6px;background:var(--bg);
  color:var(--mut);border:1px solid var(--line)}
.tag.s{background:#e4f2f9;color:#1a5e7d;border-color:#bfdeed}
.tag.g{background:#e3f7ee;color:#1b7a57;border-color:#bde9d6}
.tag.o{background:#fdf0e3;color:#a54f00;border-color:#f6d9b8}
.tag.v{background:#e8e6f7;color:#2b1a8f;border-color:#cdc8ee}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 19px;
  border-radius:9px;font-size:.87rem;font-weight:600;transition:.18s}
.btn.p{background:var(--navy);color:#fff}
.btn.p:hover{background:#0b232f}
.btn.s{background:var(--sky2);color:#fff}
.btn.g{background:var(--green2);color:#fff}
.btn.o{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.o:hover{border-color:var(--sky2);color:#1a5e7d}
.btn.full{width:100%}
.btn.lg{padding:13px 25px;font-size:.93rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.note{border-radius:10px;padding:13px 16px;font-size:.85rem;line-height:1.85;border:1px solid;
  overflow-wrap:anywhere}
.note.i{background:#e4f2f9;border-color:#bfdeed;color:#134b66}
.note.g{background:#e3f7ee;border-color:#bde9d6;color:#12654a}
.note.w{background:#fdf0e3;border-color:#f6d9b8;color:#8a4300}
.note.r{background:#fbeae8;border-color:#f2cac5;color:#8f2318}
.note.v{background:#e8e6f7;border-color:#cdc8ee;color:#221372}

/* ───── الأيام ───── */
.dayrail{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.dtab{flex:1;min-width:150px;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:13px 15px;text-align:start;transition:.16s;
  border-top:4px solid var(--line)}
.dtab:hover{border-color:var(--sky2)}
.dtab[aria-current=true]{border-color:var(--navy);border-top-color:var(--sky);
  background:linear-gradient(180deg,#f6fbfd,#fff)}
.dtab b{display:block;font-size:.95rem;font-weight:700}
.dtab span{font-size:.75rem;color:var(--mut);line-height:1.5;display:block;margin-top:2px}
.dtab .n{font-family:var(--m);font-size:.68rem;color:var(--sky2);font-weight:600}

/* ───── الوحدة ───── */
.mod{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:12px;
  overflow:hidden}
.mod-h{display:flex;align-items:center;gap:11px;padding:14px 18px;cursor:pointer;
  transition:.14s;flex-wrap:wrap}
.mod-h:hover{background:#f7fbfd}
.mod-n{min-width:44px;height:30px;line-height:28px;border-radius:8px;background:var(--navy);
  color:#fff;text-align:center;font-family:var(--m);font-size:.8rem;font-weight:600;flex-shrink:0}
.mod-h b{flex:1;min-width:170px;font-size:.97rem;font-weight:600}
.mod-h .ar{font-size:.8rem;color:var(--mut);transition:transform .2s}
.mod-h[aria-expanded=true] .ar{transform:rotate(90deg)}
.mod-b{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
.mod-b.open{display:block}
.msec{margin-top:15px}
.msec h4{font-size:.84rem;font-weight:600;color:var(--navy);margin-bottom:7px;
  padding-inline-start:10px;border-inline-start:3px solid var(--sky)}
.msec p{font-size:.89rem;line-height:1.95;margin-bottom:8px;overflow-wrap:anywhere}
.msec p.en,.mod-h b.en,.act-h b.en{direction:ltr;text-align:left;unicode-bidi:isolate;
  font-family:var(--fe)}
.tbl td.en,.tbl th.en{direction:ltr;text-align:left;font-family:var(--fe)}
.dfb p.en,.sim-h b.en{direction:ltr;text-align:left;font-family:var(--fe)}
.msec.we{background:#fdf9f2;border:1px solid #f0e2cc;border-radius:10px;padding:14px 16px}
.msec.we h4{border-inline-start-color:var(--orange);color:#a54f00}
.msec.ex{background:#fbeae8;border:1px solid #f2cac5;border-radius:10px;padding:14px 16px}
.msec.ex h4{border-inline-start-color:var(--bad);color:#8f2318}
.msec.fb{background:#e4f2f9;border:1px solid #bfdeed;border-radius:10px;padding:14px 16px}
.msec.fb h4{border-inline-start-color:var(--navy);color:#134b66}
.msec.tp{background:#e3f7ee;border:1px solid #bde9d6;border-radius:10px;padding:14px 16px}
.msec.tp h4{border-inline-start-color:var(--green2);color:#12654a}

/* ───── النشاط ───── */
.act{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:12px;
  overflow:hidden;border-inline-start:4px solid var(--green)}
.act-h{display:flex;align-items:center;gap:11px;padding:14px 18px;cursor:pointer;flex-wrap:wrap}
.act-h:hover{background:#f7fdfa}
.act-n{min-width:34px;height:30px;line-height:28px;border-radius:8px;background:var(--green2);
  color:#fff;text-align:center;font-family:var(--m);font-size:.8rem;font-weight:600;flex-shrink:0}
.act-h b{flex:1;min-width:160px;font-size:.96rem;font-weight:600}
.act-b{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
.act-b.open{display:block}
.ws{margin-top:15px;background:#f8fbfc;border:1.5px dashed var(--sky2);border-radius:11px;
  padding:15px}
.ws h4{font-size:.85rem;font-weight:600;color:#134b66;margin-bottom:9px}
.ws textarea{width:100%;min-height:120px;padding:12px 14px;border:1px solid var(--line);
  border-radius:9px;font-size:.88rem;line-height:1.8;resize:vertical;background:#fff}
.ws-f{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center}
.ws-st{font-size:.76rem;color:var(--mut);margin-inline-start:auto}

/* ───── جداول ───── */
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.85rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 12px;text-align:start;
  vertical-align:top;line-height:1.7}
.tbl th{background:var(--navy);color:#fff;font-weight:600;font-size:.82rem}
.tbl tr:nth-child(even) td{background:#f8fbfc}
.tscroll{overflow-x:auto;margin:10px 0}

/* ───── المساعد ───── */
.ai{position:fixed;bottom:20px;inset-inline-end:20px;z-index:300}
.ai-fab{width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;
  font-size:1.3rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px -8px rgba(16,48,64,.5);transition:.18s}
.ai-fab:hover{transform:scale(1.06)}
.ai-p{position:fixed;bottom:86px;inset-inline-end:20px;width:min(380px,calc(100vw - 32px));
  background:#fff;border-radius:15px;border:1px solid var(--line);z-index:301;overflow:hidden;
  box-shadow:0 20px 50px -16px rgba(16,48,64,.4);animation:pin .2s cubic-bezier(.16,1,.3,1)}
@keyframes pin{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
.ai-h{display:flex;align-items:center;gap:9px;padding:12px 15px;background:var(--navy);color:#fff}
.ai-h b{font-size:.88rem;flex:1}
.ai-x{color:#9fbccd;padding:2px 7px;border-radius:5px}
.ai-x:hover{background:rgba(255,255,255,.14);color:#fff}
.ai-n{padding:9px 15px;background:#e4f2f9;font-size:.75rem;color:#134b66;line-height:1.65;
  border-bottom:1px solid #bfdeed}
.ai-m{max-height:290px;overflow-y:auto;padding:12px 15px;display:flex;flex-direction:column;
  gap:8px;background:var(--bg)}
.msg{padding:10px 13px;border-radius:11px;font-size:.83rem;line-height:1.8;max-width:90%;
  white-space:pre-line;overflow-wrap:anywhere}
.msg.b{background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.u{background:var(--navy);color:#fff;align-self:flex-end}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:10px 15px;border-top:1px solid var(--line)}
.chips button{font-size:.74rem;padding:5px 10px;border-radius:7px;border:1.5px solid var(--line);
  background:#fff;color:var(--mut)}
.chips button:hover{border-color:var(--sky2);color:#1a5e7d}
.ai-in{display:flex;gap:5px;padding:10px 15px 13px;border-top:1px solid var(--line)}
.ai-in input{flex:1;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:.83rem}
.ai-in button{width:36px;border-radius:9px;background:var(--navy);color:#fff}

/* ───── المحاكاة ───── */
.sim{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;
  margin-bottom:14px}
.sim-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:11px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.sim-h b{font-size:1rem;flex:1;min-width:150px}
.decision{display:flex;flex-direction:column;gap:8px}
.dopt{display:block;width:100%;padding:13px 16px;border-radius:10px;border:1.8px solid var(--line);
  background:#fff;text-align:start;font-size:.89rem;line-height:1.8;transition:.16s;
  box-sizing:border-box}
.dopt:hover{border-color:var(--sky2);background:#f7fbfd}
.dopt.sel{border-color:var(--navy);background:#eef6fa}
.dopt.ok{border-color:var(--green2);background:#e3f7ee}
.dopt.no{border-color:var(--bad);background:#fbeae8}
.dfb{margin-top:13px;padding:14px 17px;border-radius:10px;border:1.5px solid;width:100%;
  box-sizing:border-box}
.dfb.ok{background:#e3f7ee;border-color:#bde9d6}
.dfb.no{background:#fbeae8;border-color:#f2cac5}
.dfb b{display:block;font-size:.9rem;margin-bottom:5px}
.dfb.ok b{color:#12654a} .dfb.no b{color:#8f2318}
.dfb p{font-size:.86rem;line-height:1.9;margin:0;white-space:pre-line;overflow-wrap:anywhere}
.simbar{display:flex;gap:6px;margin-bottom:14px}
.simbar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.simbar i.done{background:var(--green2)}
.simbar i.cur{background:var(--sky)}

/* ───── الاختبارات ───── */
.ex{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column}
.ex-bar{background:linear-gradient(180deg,#164257,var(--navy));padding:9px 16px;display:flex;
  align-items:center;gap:7px;flex-wrap:wrap;flex-shrink:0;border-bottom:3px solid #0a1f2a}
.xb-brand{display:flex;align-items:center;gap:9px;padding-inline-end:12px;
  border-inline-end:1px solid rgba(255,255,255,.18)}
.xb-brand>div b{display:block;font-size:.84rem;color:#fff;font-weight:600;line-height:1.25}
.xb-brand>div span{font-size:.67rem;color:#9fbccd}
.xb-q,.xb-t{padding-inline:13px}
.xb-q{display:flex;align-items:baseline;gap:5px;border-inline-end:1px solid rgba(255,255,255,.18)}
.xb-q span{font-size:.66rem;color:#9fbccd}
.xb-q b{font-size:1.28rem;color:#fff;font-weight:600}
.xb-q em{font-style:normal;font-size:.71rem;color:#9fbccd}
.xb-t{display:flex;flex-direction:column;align-items:center;border-radius:8px;transition:.3s}
.xb-t span{font-size:.63rem;color:#9fbccd}
.xb-t b{font-size:1.3rem;color:#fff;font-weight:600;line-height:1.15}
.xb-t.w{background:rgba(240,112,0,.25)} .xb-t.w b{color:#ffc98a}
.xb-t.d{background:rgba(192,57,43,.3);animation:pls 1.3s infinite} .xb-t.d b{color:#ff9d96}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.55}}
.ex-bar .bt{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;
  font-size:.79rem;color:#d8ebf4;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);transition:.14s}
.ex-bar .bt:hover{background:rgba(255,255,255,.16);color:#fff}
.ex-bar .bt.on{background:var(--sky);border-color:var(--sky);color:var(--navy);font-weight:600}
.ex-bar .bt[disabled]{opacity:.35;cursor:not-allowed}
.ex-bar .bt.flag.on{background:var(--orange);border-color:var(--orange);color:#fff}
.ex-bar .fsz{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13)}
@media(max-width:880px){.ex-bar .bt span{display:none}.ex-bar .bt{padding:7px 10px}}
.ex-body{flex:1;overflow-y:auto;padding:15px 18px}
.qw{max-width:960px;margin:0 auto}
.qc{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px 22px;
  margin-bottom:11px}
.qh{display:block;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--line);
  line-height:2}
.qh>*{display:inline-block;vertical-align:middle;margin-inline-end:8px}
.qn{min-width:32px;height:30px;line-height:28px;border-radius:8px;background:var(--navy);
  color:#fff;text-align:center;font-weight:600;font-size:.85rem;padding:0 7px}
.qtxt{font-size:1rem;line-height:1.95;margin-bottom:14px;overflow-wrap:anywhere}
.pick-n{background:#e4f2f9;border:1px solid #bfdeed;border-inline-start:3px solid var(--navy);
  border-radius:8px;padding:10px 15px;font-size:.87rem;color:#134b66;margin-bottom:12px}
.olist{display:block}
.o{display:flex;gap:11px;align-items:center;padding:12px 16px;border-radius:10px;
  border:1.8px solid var(--line);background:#fff;cursor:pointer;transition:.16s;
  width:100%;box-sizing:border-box;margin-bottom:7px}
.o:hover{border-color:var(--sky2);background:#f7fbfd}
.o.sel{border-color:var(--navy);background:#eef6fa}
.o.right{border-color:var(--green2);background:#e3f7ee}
.o.wrong{border-color:var(--bad);background:#fbeae8}
.o.out{opacity:.4} .o.out .ot{text-decoration:line-through}
.mark{width:20px;height:20px;flex-shrink:0;border:2px solid #92a8b6;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:.74rem;color:#fff;
  font-weight:700;transition:.14s;order:-2}
.mark.rad{border-radius:50%} .mark.box{border-radius:4px}
.o:hover .mark{border-color:var(--sky2)}
.o.sel .mark{border-color:var(--navy);background:var(--navy)}
.o.sel .mark.rad{box-shadow:inset 0 0 0 3.5px #fff;background:var(--navy)}
.o.right .mark{border-color:var(--green2);background:var(--green2)}
.o.wrong .mark{border-color:var(--bad);background:var(--bad)}
.olt{font-weight:700;font-size:.89rem;color:var(--navy);flex-shrink:0;min-width:20px;order:-1}
.ot{flex:1;font-size:.91rem;line-height:1.8;overflow-wrap:anywhere}
.strike{opacity:0;font-size:.75rem;color:var(--mut);padding:3px 6px;border-radius:5px;flex-shrink:0}
.o:hover .strike{opacity:1}
.strike:hover{background:#fbeae8;color:var(--bad)}
.vmark{width:22px;height:22px;border-radius:50%;line-height:21px;text-align:center;
  font-size:.76rem;font-weight:700;color:#fff;flex-shrink:0;margin-inline-start:auto}

/* ───── اللوحة ───── */
.dash{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.dk{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.dk-c{flex:1;min-width:118px;border:1.5px solid var(--line);border-radius:11px;padding:13px;
  text-align:center;background:#fff}
.dk-c b{display:block;font-size:1.45rem;font-weight:600;color:var(--navy)}
.dk-c b em{font-style:normal;font-size:.85rem;color:var(--mut)}
.dk-c span{font-size:.71rem;color:var(--mut)}
.dk-b{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:7px}
.dk-b i{display:block;height:100%;background:var(--sky2);transition:.4s}
.dk-c.g{border-color:#bde9d6;background:#f4fbf8} .dk-c.g b{color:var(--green2)}
.dk-c.g .dk-b i{background:var(--green2)}
.dk-c.m{border-color:#f6d9b8;background:#fdf9f4} .dk-c.m b{color:#a54f00}
.dk-c.m .dk-b i{background:var(--orange)}
.dk-c.b{border-color:#f2cac5;background:#fdf6f5} .dk-c.b b{color:var(--bad)}
.dk-c.b .dk-b i{background:var(--bad)}
.dash-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:11px}
.dcard{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.dcard h4{font-size:.84rem;font-weight:600;color:var(--navy);margin-bottom:10px}
.dsvg{width:100%;height:auto;display:block}
.dleg{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px;font-size:.73rem;color:var(--mut)}
.dleg span{display:flex;align-items:center;gap:5px}
.dleg i{width:10px;height:10px;border-radius:3px;display:block}
.dbars{display:flex;flex-direction:column;gap:8px}
.dbar{display:flex;align-items:center;gap:9px}
.dbl{font-size:.76rem;min-width:82px;color:var(--mut)}
.dbt{flex:1;height:9px;background:var(--bg);border-radius:5px;overflow:hidden}
.dbt i{display:block;height:100%;background:linear-gradient(90deg,var(--sky2),var(--green2))}
.dbv{font-size:.73rem;color:var(--navy);min-width:36px;text-align:end}
.dkv{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.dkv>div{flex:1;min-width:64px;text-align:center;background:var(--bg);border-radius:8px;padding:8px}
.dkv b{display:block;font-size:1.05rem;color:var(--navy)}
.dkv span{font-size:.66rem;color:var(--mut)}
.dnote{font-size:.71rem;color:var(--mut);text-align:center;margin-top:6px}
.dexp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--line)}
.dexp>.btn{flex:0 0 auto;width:auto}
.dexp-l{font-size:.8rem;color:var(--mut);font-weight:600}

/* ───── جلسة الفيديو ───── */
.bd-team{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.bd-mini{width:104px;text-align:center}
.bd-mini .av-svg{width:100%;height:auto;border-radius:11px;display:block}
.bd-mini b{display:block;font-size:.76rem;margin-top:6px;font-weight:600}
.bd-mini span{font-size:.68rem;color:var(--mut);line-height:1.4;display:block}
.bd-call{display:grid;grid-template-columns:1fr 132px;gap:11px;margin-bottom:13px}
@media(max-width:640px){.bd-call{grid-template-columns:1fr}}
.bd-main{position:relative;background:var(--navy);border-radius:14px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;min-height:250px}
.bd-main .av-svg{width:auto;height:250px;display:block}
.bd-name{position:absolute;bottom:11px;inset-inline-start:11px;background:rgba(16,48,64,.9);
  border-radius:9px;padding:7px 13px;backdrop-filter:blur(8px)}
.bd-name b{display:block;font-size:.83rem;color:#fff}
.bd-name span{font-size:.7rem;color:var(--sky)}
.bd-live{position:absolute;top:11px;inset-inline-end:11px;background:rgba(192,57,43,.92);
  color:#fff;font-size:.7rem;padding:4px 11px;border-radius:20px;animation:pls 1.4s infinite}
.bd-side{display:flex;flex-direction:column;gap:9px}
@media(max-width:640px){.bd-side{flex-direction:row}}
.bd-thumb{position:relative;background:var(--navy);border-radius:11px;overflow:hidden;flex:1;
  display:flex;align-items:center;justify-content:center;min-height:76px}
.bd-thumb .av-svg{width:100%;height:auto;opacity:.72}
.bd-thumb video{width:100%;height:100%;object-fit:cover;min-height:76px}
.bd-thumb span{position:absolute;bottom:4px;inset-inline-start:6px;font-size:.65rem;
  color:#fff;background:rgba(0,0,0,.55);padding:1px 7px;border-radius:5px}
.bd-thumb.me{border:2px solid var(--sky)}
.bd-thumb .bd-noc{font-size:1.4rem;padding:24px}
/* ───── الميثاق ───── */
.ch-bar{display:flex;align-items:center;gap:11px;margin-bottom:13px;font-size:.82rem;color:var(--mut)}
.ch-bar i{flex:1;height:7px;background:var(--line);border-radius:4px;display:block;overflow:hidden}
.ch-bar i b{display:block;height:100%;background:linear-gradient(90deg,var(--sky2),var(--green2));
  border-radius:4px;transition:.4s}
.ch{display:flex;flex-direction:column;gap:7px}
.ch-s{border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.ch-s.on{border-color:var(--sky2)}
.ch-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 15px;text-align:start;
  transition:.14s}
.ch-h:hover{background:#f7fbfd}
.ch-h b{flex:1;font-size:.9rem;font-weight:600}
.ch-h .ar{font-size:.8rem;color:var(--mut);transition:transform .2s}
.ch-s.on .ch-h .ar{transform:rotate(90deg)}
.ch-b{padding:0 15px 15px;display:flex;flex-direction:column;gap:11px;border-top:1px solid var(--line)}
.ch-b .lf-f:first-child{margin-top:13px}
.ch-doc{padding:0;overflow-y:auto;background:#fff}
.ch-dh{display:flex;align-items:center;gap:14px;padding:22px 26px;border-bottom:3px solid var(--navy);
  background:linear-gradient(135deg,#f4f9fc,#fff)}
.ch-logo{font-family:var(--fe);font-weight:700;font-size:1.5rem;color:var(--navy);
  direction:ltr;letter-spacing:-.5px}
.ch-logo i{color:var(--sky);font-style:normal}
.ch-dh>div:nth-child(2){flex:1}
.ch-dh b{display:block;font-size:1.1rem;font-weight:700}
.ch-dh span{font-size:.78rem;color:var(--mut)}
.ch-date{font-size:.8rem;color:var(--mut);font-family:var(--m)}
.ch-ds{padding:18px 26px;border-bottom:1px solid var(--line)}
.ch-ds h3{font-size:.95rem;font-weight:700;color:var(--navy);margin-bottom:11px;
  padding-bottom:6px;border-bottom:2px solid var(--sky)}
.ch-dr{display:grid;grid-template-columns:190px 1fr;gap:14px;padding:8px 0;
  border-bottom:1px dashed var(--line)}
.ch-dr:last-child{border-bottom:0}
@media(max-width:600px){.ch-dr{grid-template-columns:1fr;gap:3px}}
.ch-dl{font-size:.8rem;color:var(--mut);font-weight:500}
.ch-dv{font-size:.86rem;line-height:1.9;overflow-wrap:anywhere}
.ch-foot{padding:18px 26px;text-align:center;font-size:.82rem;color:var(--mut);
  background:var(--bg);line-height:1.9}
/* ───── السجلّ ───── */
.sk-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
.sk-t{border-collapse:collapse;font-size:.8rem;min-width:1200px}
.sk-t th{background:var(--navy);color:#fff;padding:9px 11px;text-align:start;font-weight:600;
  font-size:.78rem;white-space:nowrap;position:sticky;top:0}
.sk-t td{border:1px solid var(--line);padding:5px;vertical-align:top}
.sk-t tr:nth-child(even) td{background:#fafcfd}
.sk-n{width:34px;text-align:center;color:var(--mut)}
.sk-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:11px}
.sk-c{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px}
.sk-ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.sk-cn{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:.74rem;flex-shrink:0}
.sk-ch>div{flex:1;min-width:0}
.sk-ch b{display:block;font-size:.89rem;font-weight:600}
.sk-ch span{font-size:.74rem;color:var(--mut)}
.sk-cm{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.sk-cf{margin-bottom:8px}
.sk-cf b{display:block;font-size:.73rem;color:var(--mut);margin-bottom:2px}
.sk-cf p{font-size:.8rem;line-height:1.7;margin:0}
.sk-cf.hi{background:#f0f7fb;border-radius:8px;padding:9px 11px}
.sk-cf.hi b{color:#1a5e7d}
.sk-cq{display:flex;gap:9px;flex-wrap:wrap;font-size:.72rem;color:var(--mut);
  padding-top:8px;border-top:1px solid var(--line)}
/* ───── مصفوفة النفوذ والاهتمام ───── */
.pim{display:grid;grid-template-columns:26px 1fr;grid-template-rows:1fr 26px;gap:7px;
  margin-bottom:13px}
.pim-y{grid-row:1;grid-column:1;writing-mode:vertical-rl;transform:rotate(180deg);
  text-align:center;font-size:.78rem;color:var(--mut);font-weight:600}
.pim-x{grid-row:2;grid-column:2;text-align:center;font-size:.78rem;color:var(--mut);font-weight:600}
.pim-box{grid-row:1;grid-column:2;position:relative;aspect-ratio:1.5;
  border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pim-q{position:absolute;display:flex;align-items:flex-start;justify-content:center;
  padding-top:9px}
.pim-q span{font-size:.75rem;font-weight:600;opacity:.55;text-align:center;padding:0 6px}
.pim-q.q1{background:rgba(240,112,0,.1)} .pim-q.q1 span{color:#a54f00}
.pim-q.q2{background:rgba(64,192,144,.1)} .pim-q.q2 span{color:#12654a}
.pim-q.q3{background:rgba(112,192,224,.11)} .pim-q.q3 span{color:#1a5e7d}
.pim-q.q4{background:rgba(0,0,0,.03)} .pim-q.q4 span{color:var(--mut)}
.pim-gl{position:absolute;background:var(--line)}
.pim-gl.v{left:50%;top:0;bottom:0;width:2px} .pim-gl.h{top:50%;left:0;right:0;height:2px}
.pim-d{position:absolute;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:700;
  color:#fff;cursor:default;box-shadow:0 3px 9px -3px rgba(0,0,0,.4);border:2px solid #fff;
  transition:.18s;z-index:2}
.pim-d:hover{transform:translate(-50%,-50%) scale(1.25);z-index:5}
.pim-d.champ,.pim-d.sup{background:var(--green2)}
.pim-d.neut{background:var(--sky2)}
.pim-d.res{background:var(--bad)}
.pim-d.unaw{background:var(--orange)}
.pim-leg{display:flex;gap:9px;flex-wrap:wrap;font-size:.78rem}
.pim-lg{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:7px;
  padding:4px 10px}
.pim-lg b{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.68rem;color:#fff}
.pim-lg b.champ,.pim-lg b.sup{background:var(--green2)}
.pim-lg b.neut{background:var(--sky2)}
.pim-lg b.res{background:var(--bad)}
.pim-lg b.unaw{background:var(--orange)}
@media print{.ch-doc{display:block!important;visibility:visible!important}
  .navov{position:static;background:#fff;padding:0}
  .navp{box-shadow:none;max-height:none}
  .navh,.pop-x{display:none}}

/* ───── الحالة الدراسية ───── */
.case{background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--orange);
  border-radius:13px;margin-bottom:14px;overflow:hidden}
.case-h{display:block;padding:13px 19px;background:#fdf6ee;border-bottom:1px solid var(--line);
  line-height:2}
.case-h>*{display:inline-block;vertical-align:middle;margin-inline-end:8px}
.case-h b{font-size:.96rem;font-weight:600}
.case-b{padding:20px;font-size:.92rem;line-height:2.05}
.case-b.fold{max-height:260px;overflow:hidden;position:relative}
.case-b.fold::after{content:"";position:absolute;inset-inline:0;bottom:0;height:80px;
  background:linear-gradient(transparent,#fff)}
.case-b p{margin-bottom:13px;overflow-wrap:anywhere}
.case-b strong{color:var(--navy);font-weight:600}
.case-more{width:100%;padding:11px;background:#fdf6ee;border-top:1px solid var(--line);
  font-size:.84rem;font-weight:600;color:#a54f00}
.case-more:hover{background:#fbeedd}

/* ───── حماية المحتوى ───── */
.ex,.ex *,.mod-b,.act-b,.pmi,.rv,.fbp,#revBox,.case,.sim,.dfb,
.qtxt,.olist,.msec,.tbl,.qw{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none}
.ws textarea,input,select,textarea{-webkit-user-select:text;user-select:text}
#pshield{position:fixed;inset:0;z-index:99999;background:rgba(16,48,64,.985);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(22px)}
#pshield>div{text-align:center;color:#fff}
#pshield b{display:block;font-size:3.4rem;margin-bottom:14px}
#pshield span{font-size:1.02rem;color:var(--sky)}
#ptoast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;padding:12px 22px;border-radius:11px;z-index:99998;
  font-size:.87rem;opacity:0;pointer-events:none;transition:.25s;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:90vw;text-align:center}
#ptoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media print{
  .ex,.mod-b,.act-b,.rv,.fbp,#revBox,.case,.sim,.qw,.qtxt,.olist,.msec,.tbl{
    display:none!important;visibility:hidden!important}
  body::before{content:attr(data-pmsg);display:block;padding:80px 40px;
    text-align:center;font-size:20px;font-family:sans-serif}
}

@media print{.top,.nav,.rp-act,.ex-foot,.ai{display:none}body{background:#fff}}
</style>
